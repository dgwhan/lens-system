<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">
    <h:head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sign In - Lens Camera Rental</title>
        <h:outputStylesheet library="css" name="font.css" />
        <h:outputStylesheet library="css" name="app.css" />
        <h:outputStylesheet library="css" name="buttons.css" />
        <h:outputStylesheet library="css" name="auth.css" />
    </h:head>
    <h:body class="auth-page">
        <!-- Flash Alert Message (E.g. Registration successful) -->
        <h:panelGroup rendered="#{not empty flash.actionAlert}">
            <script type="text/javascript">
                alert('#{flash.actionAlert}');
            </script>
        </h:panelGroup>

        <div class="auth-container">

            <!-- Login Card -->
            <div class="auth-card">
                <div class="auth-card-header">
                    <h2 class="auth-card-title">Sign In</h2>
                </div>

                <div class="auth-card-body">
                    <!-- Global FacesMessages (E.g. Login failed: Incorrect username or password) -->
                    <h:messages globalOnly="true" 
                                styleClass="auth-messages-list" 
                                errorClass="auth-msg-error" 
                                infoClass="auth-msg-info" />

                    <!-- Login Form -->
                    <h:form id="loginForm" styleClass="auth-form">
                        <div class="auth-form-group">
                            <h:outputLabel for="username" value="Username" styleClass="auth-label">
                                <span class="auth-required">*</span>
                            </h:outputLabel>
                            <h:inputText id="username" 
                                         value="#{authController.username}" 
                                         required="true"
                                         requiredMessage="Please enter your username"
                                         styleClass="auth-input" 
                                         autocomplete="username" 
                                         pt:placeholder="Enter your username" />
                            <h:message for="username" styleClass="field-error" />
                        </div>

                        <div class="auth-form-group">
                            <h:outputLabel for="password" value="Password" styleClass="auth-label">
                                <span class="auth-required">*</span>
                            </h:outputLabel>
                            <h:inputSecret id="password" 
                                           value="#{authController.password}" 
                                           required="true"
                                           requiredMessage="Please enter your password"
                                           styleClass="auth-input" 
                                           autocomplete="current-password" 
                                           pt:placeholder="Enter your password" />
                            <h:message for="password" styleClass="field-error" />
                        </div>

                        <div class="auth-form-group" style="margin-top: 0.5rem;">
                            <h:commandButton value="Sign In" 
                                             action="#{authController.login}" 
                                             styleClass="btn-auth" />
                        </div>
                    </h:form>
                </div>

                <div class="auth-card-footer">
                    <span>Don't have an account?</span>
                    <h:link outcome="/register" value="Create an account" styleClass="auth-link" />
                </div>
            </div>


        </div>
    </h:body>
</html>
