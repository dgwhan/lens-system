<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">
    <h:head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Devices Management - Lens Camera Rental</title>
        <h:outputStylesheet library="css" name="font.css" />
        <h:outputStylesheet library="css" name="app.css" />
        <h:outputStylesheet library="css" name="buttons.css" />
        <h:outputStylesheet library="css" name="table.css" />
        <h:outputStylesheet library="css" name="badges.css" />
    </h:head>
    <h:body>
        <!-- Flash Alert Message (Thông báo thao tác thành công) -->
        <h:panelGroup rendered="#{not empty flash.actionAlert}">
            <script type="text/javascript">
                alert('#{flash.actionAlert}');
            </script>
        </h:panelGroup>

        <div class="main-wrapper">
            <h:form id="devicesForm">
                <!-- Tiêu đề trang -->
                <div class="page-header">
                    <div class="page-header-row">
                        <div>
                            <div class="page-pretitle">Overview</div>
                            <h1 class="page-title">Devices Management</h1>
                        </div>
                        <div>
                            <h:commandButton value="+ Add Device"
                                             action="#{devicesMB.newDevice()}"
                                             styleClass="btn btn-primary" />
                        </div>
                    </div>
                </div>

                <!-- Thanh tìm kiếm và bộ lọc trạng thái -->
                <h:panelGroup id="searchBar" layout="block" styleClass="users-search">
                    <h:inputText id="keyword" value="#{devicesMB.keyword}"
                                 pt:placeholder="Search serial number, brand, model..."
                                 styleClass="form-control search-input">
                        <f:ajax event="keyup" delay="300" render="devicesTableWrapper" />
                    </h:inputText>

                    <h:commandButton value="Search" action="list" styleClass="btn btn-primary">
                        <f:ajax execute="@form" render="devicesTableWrapper" />
                    </h:commandButton>

                    <!-- Lọc theo trạng thái -->
                    <h:selectOneMenu id="statusFilter" value="#{devicesMB.status}" styleClass="form-select" style="width: 140px;">
                        <f:selectItem itemLabel="All Statuses" itemValue="" />
                        <f:selectItem itemLabel="Available" itemValue="AVAILABLE" />
                        <f:selectItem itemLabel="Renting" itemValue="RENTING" />
                        <f:ajax event="change" render="devicesTableWrapper" />
                    </h:selectOneMenu>

                    <h:commandButton value="Reset" action="#{devicesMB.resetFilter()}" styleClass="btn btn-outline-secondary">
                        <f:ajax render="searchBar devicesTableWrapper" />
                    </h:commandButton>
                </h:panelGroup>

                <!-- Thẻ bảng danh sách thiết bị -->
                <div class="card">
                    <h:panelGroup id="devicesTableWrapper" layout="block" styleClass="table-wrapper">
                        <h:dataTable id="devicesTable"
                                     value="#{devicesMB.devicesList}"
                                     var="device"
                                     styleClass="data-table">

                            <!-- ID -->
                            <h:column>
                                <f:facet name="header">ID</f:facet>
                                <h:outputText value="#{device.id}" />
                            </h:column>

                            <!-- Serial Number -->
                            <h:column>
                                <f:facet name="header">Serial Number</f:facet>
                                <code style="font-size: 0.875rem; font-weight: 600; color: #0f172a;">#{device.serialNumber}</code>
                            </h:column>

                            <!-- Device Model -->
                            <h:column>
                                <f:facet name="header">Device Model</f:facet>
                                <h:outputText value="#{device.deviceModelId.brand} - #{device.deviceModelId.name}" style="font-weight: 600;" />
                                <h:panelGroup rendered="#{not empty device.deviceModelId.model}">
                                    <div style="font-size: 0.75rem; color: #64748b;">(#{device.deviceModelId.model})</div>
                                </h:panelGroup>
                            </h:column>

                            <!-- Status -->
                            <h:column>
                                <f:facet name="header">Status</f:facet>
                                <span class="badge-status #{device.status == 'AVAILABLE' ? 'badge-active' : 'badge-customer'}">
                                    <h:outputText value="#{device.status}" />
                                </span>
                            </h:column>

                            <!-- Created At -->
                            <h:column>
                                <f:facet name="header">Created At</f:facet>
                                <h:outputText value="#{device.createdAt}">
                                    <f:convertDateTime pattern="yyyy-MM-dd HH:mm" />
                                </h:outputText>
                            </h:column>

                            <!-- Thao tác (Action) -->
                            <h:column>
                                <f:facet name="header">Action</f:facet>
                                <div class="table-row-actions">
                                    <h:commandButton value="Detail"
                                                     action="#{devicesMB.detailDevice(device.id)}"
                                                     styleClass="btn btn-sm btn-outline-info"/>
                                    
                                    <h:commandButton value="Edit"
                                                     action="#{devicesMB.editDevice(device.id)}"
                                                     styleClass="btn btn-sm btn-outline-primary"/>
                                    
                                    <h:commandButton value="Delete"
                                                     action="#{devicesMB.deleteDevice(device.id)}"
                                                     onclick="if (!confirm('Are you sure you want to delete this device?')) return false;"
                                                     styleClass="btn btn-sm btn-outline-danger">
                                        <f:ajax render="devicesTableWrapper" />
                                    </h:commandButton>
                                </div>
                            </h:column>
                            
                            

                        </h:dataTable>
                    </h:panelGroup>
                </div>
            </h:form>
        </div>
    </h:body>
</html>
