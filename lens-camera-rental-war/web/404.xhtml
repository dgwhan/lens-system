<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Page not found</title>
    <h:outputStylesheet library="css" name="font.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #111111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1.5rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #111111;
            letter-spacing: -0.025em;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.625rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            color: #ffffff;
            background-color: #111111;
            border: 1px solid #111111;
            border-radius: 6px;
            transition: all 0.15s ease-in-out;
            cursor: pointer;
        }

        .btn-home:hover {
            background-color: #374151;
            border-color: #374151;
            color: #ffffff;
        }

        .btn-home:active {
            background-color: #1f2937;
            border-color: #1f2937;
        }
    </style>
</h:head>
<h:body>
    <f:metadata>
        <f:event type="preRenderView" listener="#{facesContext.externalContext.setResponseStatus(404)}" />
    </f:metadata>
    <div class="container">
        <h1>404 Page not found</h1>
        <h:link outcome="/index" value="Back to Home" styleClass="btn-home" />
    </div>
</h:body>
</html>
