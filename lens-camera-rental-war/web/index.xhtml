<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lens Camera Rental - Premium Camera &amp; Lens Equipment</title>
    <h:outputStylesheet library="css" name="font.css" />
    <h:outputStylesheet library="css" name="app.css" />
    <h:outputStylesheet library="css" name="buttons.css" />
    <h:outputStylesheet library="css" name="customer.css" />
    <h:outputStylesheet library="css" name="header.css" />
    <h:outputStylesheet library="css" name="search.css" />
    <h:outputStylesheet library="css" name="nav.css" />
    <h:outputStylesheet library="css" name="device-card.css" />
</h:head>

<h:body>
    <!-- Flash Alert Message (E.g. Login successful) -->
    <h:panelGroup rendered="#{not empty flash.actionAlert}">
        <script type="text/javascript">
            alert('#{flash.actionAlert}');
        </script>
    </h:panelGroup>

    <!-- Shared Header Component -->
    <ui:include src="/components/header.xhtml" />

    <!-- Featured Devices Section -->
    <section class="featured-devices-section">
        <div class="featured-devices-container">
            <!-- Section Header -->
            <ui:include src="/components/page-title.xhtml">
                <ui:param name="title" value="Featured Devices" />
                <ui:param name="subtitle" value="Explore our devices" />
                <ui:param name="linkText" value="View All Devices" />
                <ui:param name="linkUrl" value="#{request.contextPath}/faces/devices.xhtml" />
            </ui:include>

            <!-- Dynamic Device Cards Grid (Reusing device-grid component) -->
            <ui:include src="/components/device-grid.xhtml">
                <ui:param name="devices" value="#{homeController.featuredDevices}" />
                <ui:param name="controller" value="#{homeController}" />
            </ui:include>
        </div>
    </section>

    <!-- Shared Footer Component -->
    <ui:include src="/components/footer.xhtml" />

    <!-- Client-side Scripts -->
    <h:outputScript library="js" name="user-dropdown.js" />
    <h:outputScript library="js" name="header.js" />
</h:body>

</html>
