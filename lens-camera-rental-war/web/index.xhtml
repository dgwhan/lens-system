<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lens Camera Rental</title>
    <h:outputStylesheet library="css" name="font.css" />
    <h:outputStylesheet library="css" name="app.css" />
    <h:outputStylesheet library="css" name="buttons.css" />
    <h:outputStylesheet library="css" name="customer.css" />
</h:head>

<h:body>
    <!-- Flash Alert Message (E.g. Login successful) -->
    <h:panelGroup rendered="#{not empty flash.actionAlert}">
        <script type="text/javascript">
            alert('#{flash.actionAlert}');
        </script>
    </h:panelGroup>

    <div class="main-wrapper">
        <div class="page-header">
            <div class="page-header-row">
                <div>
                    <h1 class="page-title">Welcome to Lens - Camera Rental</h1>
                </div>
                <div class="page-header-actions">
                    <!-- Guest -->
                    <h:panelGroup rendered="#{empty request.userPrincipal}">
                        <h:link outcome="/login" value="Sign In" styleClass="btn btn-primary" />
                        <h:link outcome="/register" value="Register" styleClass="btn btn-outline-secondary" />
                    </h:panelGroup>

                    <!-- Logged in users (Admin and Customer) -->
                    <h:panelGroup rendered="#{not empty request.userPrincipal}">
                        <!-- Admin shortcut -->
                        <h:panelGroup rendered="#{request.isUserInRole('ADMIN')}">
                            <h:link outcome="/admin/dashboard" value="Go to Admin Dashboard"
                                styleClass="btn btn-primary btn-admin-shortcut" />
                        </h:panelGroup>

                        <!-- User name dropdown: click to reveal logout -->
                        <div class="user-dropdown">
                            <button type="button" class="btn btn-outline-secondary user-dropdown-toggle" onclick="toggleUserDropdown(event)">
                                #{authController.currentUserFullName}
                                <span class="user-dropdown-caret">&#9662;</span>
                            </button>
                            <div id="userDropdownMenu" class="user-dropdown-menu">
                                <h:form styleClass="user-dropdown-form">
                                    <h:commandLink action="#{authController.logout}" value="Logout"
                                        styleClass="user-dropdown-item dropdown-item-danger" />
                                </h:form>
                            </div>
                        </div>
                    </h:panelGroup>
                </div>
            </div>
        </div>
    </div>

    <h:outputScript library="js" name="user-dropdown.js" />
</h:body>

</html>
