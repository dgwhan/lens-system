<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">

    <!-- Auto-include DatePicker Stylesheet and Script Resources -->
    <h:outputStylesheet library="css" name="datepicker.css" />
    <h:outputScript library="js" name="datepicker.js" />

    <!-- Date Range Picker Component Container -->
    <div id="#{not empty id ? id : 'dateRangePicker'}"
         class="custom-datepicker-wrapper"
         data-initial-start="#{startValue}"
         data-initial-end="#{endValue}">

        <!-- Top Dual-Input Boxes: START DATE & END DATE -->
        <div class="datepicker-inputs-row">
            <!-- Start Date Column -->
            <div class="datepicker-field-col">
                <label class="datepicker-field-label">
                    #{not empty startLabel ? startLabel : 'START DATE'}
                </label>
                <div class="datepicker-input-box is-active" data-role="start-box">
                    <span class="datepicker-display-value" data-role="start-display">
                        #{not empty startValue ? startValue : '--/--/----'}
                    </span>
                    <span class="datepicker-format-hint">
                        #{not empty formatHint ? formatHint : 'DD/MM/YYYY'}
                    </span>
                </div>
            </div>

            <!-- End Date Column -->
            <div class="datepicker-field-col">
                <label class="datepicker-field-label">
                    #{not empty endLabel ? endLabel : 'END DATE'}
                </label>
                <div class="datepicker-input-box" data-role="end-box">
                    <span class="datepicker-display-value" data-role="end-display">
                        #{not empty endValue ? endValue : '--/--/----'}
                    </span>
                    <span class="datepicker-format-hint">
                        #{not empty formatHint ? formatHint : 'DD/MM/YYYY'}
                    </span>
                </div>
            </div>
        </div>

        <!-- Hidden inputs for JSF Form binding -->
        <input type="hidden"
               id="#{not empty startDateId ? startDateId : 'startDateHidden'}"
               name="#{not empty startDateName ? startDateName : 'startDate'}"
               value="#{startValue}"
               data-role="start-hidden" />

        <input type="hidden"
               id="#{not empty endDateId ? endDateId : 'endDateHidden'}"
               name="#{not empty endDateName ? endDateName : 'endDate'}"
               value="#{endValue}"
               data-role="end-hidden" />

        <!-- Calendar Card -->
        <div class="datepicker-calendar-card">
            <!-- Header: Month/Year Title & Prev/Next Arrows -->
            <div class="datepicker-header">
                <h4 class="datepicker-title" data-role="calendar-title">October 2026</h4>
                <div class="datepicker-nav-buttons">
                    <button type="button" class="datepicker-nav-btn" data-role="prev-month" aria-label="Previous month">
                        <svg viewBox="0 0 24 24">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <button type="button" class="datepicker-nav-btn" data-role="next-month" aria-label="Next month">
                        <svg viewBox="0 0 24 24">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Weekdays Row (Mon, Tue, Wed, Thu, Fri, Sat, Sun) -->
            <div class="datepicker-weekdays">
                <span class="datepicker-weekday">Mon</span>
                <span class="datepicker-weekday">Tue</span>
                <span class="datepicker-weekday">Wed</span>
                <span class="datepicker-weekday">Thu</span>
                <span class="datepicker-weekday">Fri</span>
                <span class="datepicker-weekday">Sat</span>
                <span class="datepicker-weekday">Sun</span>
            </div>

            <!-- Calendar Days Grid (Dynamically rendered by datepicker.js) -->
            <div class="datepicker-days-grid" data-role="days-grid">
                <!-- Days are generated dynamically via JavaScript -->
            </div>

            <!-- Footer: Reset link & Set Range button -->
            <div class="datepicker-footer">
                <button type="button" class="datepicker-btn-reset" data-role="reset-btn">
                    #{not empty resetLabel ? resetLabel : 'Reset'}
                </button>
                <button type="button" class="datepicker-btn-apply" data-role="apply-btn">
                    #{not empty applyLabel ? applyLabel : 'Set Range'}
                </button>
            </div>
        </div>
    </div>
</ui:composition>
