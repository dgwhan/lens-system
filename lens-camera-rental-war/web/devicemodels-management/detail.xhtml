<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>#{deviceModelsMB.deviceModels.name} - Device Model Details</title>
    <h:outputStylesheet library="css" name="font.css" />
    <h:outputStylesheet library="css" name="app.css" />
    <h:outputStylesheet library="css" name="buttons.css" />
    <h:outputStylesheet library="css" name="badges.css" />
    <h:outputStylesheet library="css" name="detail.css" />
    <h:outputStylesheet library="css" name="device-model.css" />
</h:head>
<h:body>
    <div class="main-wrapper">
        <div class="detail-page-container">
            <h:form id="detailForm">
                <!-- Page Header -->
                <div class="detail-header">
                    <div class="detail-header-row">
                        <div>
                            <div class="detail-eyebrow">DEVICE MODELS</div>
                            <h1 class="detail-title">Device Model Details</h1>
                        </div>
                        <div class="detail-actions">
                            <h:commandButton value="Back" action="list" immediate="true"
                                             styleClass="btn btn-outline-secondary" />
                            <h:commandButton value="Edit Model"
                                             action="#{deviceModelsMB.editDeviceModel(deviceModelsMB.deviceModels.id)}"
                                             styleClass="btn btn-primary" />
                        </div>
                    </div>
                </div>

                <!-- 2-Column Detail Layout -->
                <div class="detail-layout">
                    <!-- Main Column (Left) -->
                    <div class="detail-main">
                        <!-- Basic Information Card (Primary Identity) -->
                        <div class="detail-card">
                            <div class="detail-card-header">
                                <h2 class="detail-card-title">Basic Information</h2>
                            </div>
                            <div class="detail-card-body">
                                <div class="detail-identity-row">
                                    <img src="#{deviceModelsMB.modelImageUrl}"
                                         alt="#{deviceModelsMB.deviceModels.name}"
                                         class="detail-image"
                                         onerror="this.onerror=null;this.src='#{deviceModelsMB.defaultImageUrl}';" />

                                    <div class="detail-identity-content">
                                        <div class="detail-identity-field">
                                            <div class="detail-label">Model Name</div>
                                            <h3 class="detail-identity-title">
                                                <h:outputText value="#{deviceModelsMB.deviceModels.name}" />
                                            </h3>
                                        </div>
                                        <div class="detail-item">
                                            <div class="detail-label">Model ID</div>
                                            <div class="detail-value detail-value-strong">
                                                <h:outputText value="Model ##{deviceModelsMB.deviceModels.id}" />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Specifications Card (Technical Specifications, Classification & Description) -->
                        <div class="detail-card">
                            <div class="detail-card-header">
                                <h2 class="detail-card-title">Specifications</h2>
                            </div>
                            <div class="detail-card-body">
                                <div class="detail-grid-specs">
                                    <div class="detail-item">
                                        <div class="detail-label">Brand</div>
                                        <div class="detail-value detail-value-strong">
                                            <h:outputText value="#{deviceModelsMB.deviceModels.brand}" />
                                        </div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">Model Code</div>
                                        <div class="detail-value">
                                            <h:outputText value="#{deviceModelsMB.deviceModels.model}" />
                                        </div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">Type</div>
                                        <div class="detail-value">
                                            <h:outputText value="#{deviceModelsMB.deviceModels.type}" />
                                        </div>
                                    </div>
                                    <div class="detail-item detail-item-full">
                                        <div class="detail-label">Description</div>
                                        <div class="detail-value #{empty deviceModelsMB.deviceModels.description ? 'detail-empty' : ''}">
                                            <h:outputText value="#{not empty deviceModelsMB.deviceModels.description ? deviceModelsMB.deviceModels.description : 'No description provided.'}" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Sidebar Column (Right) -->
                    <div class="detail-sidebar">
                        <!-- Status Card -->
                        <div class="detail-card">
                            <div class="detail-card-header detail-status-card-header">
                                <h2 class="detail-card-title">Status</h2>
                                <span class="badge-status badge-active">Active</span>
                            </div>
                        </div>

                        <!-- Pricing Card -->
                        <div class="detail-card">
                            <div class="detail-card-header">
                                <h2 class="detail-card-title">Pricing</h2>
                            </div>
                            <div class="detail-card-body">
                                <div class="detail-price-list">
                                    <div class="detail-price-item">
                                        <div class="detail-label">Rental Price</div>
                                        <div class="detail-price-row">
                                            <span class="detail-price-value">
                                                <h:outputText value="#{deviceModelsMB.deviceModels.rentalPrice}">
                                                    <f:convertNumber pattern="#,##0 VND" />
                                                </h:outputText>
                                            </span>
                                            <span class="detail-price-unit">/(per day)</span>
                                        </div>
                                    </div>
                                    <div class="detail-price-item">
                                        <div class="detail-label">Deposit</div>
                                        <div class="detail-price-row">
                                            <span class="detail-price-value">
                                                <h:outputText value="#{deviceModelsMB.deviceModels.depositAmount}">
                                                    <f:convertNumber pattern="#,##0 VND" />
                                                </h:outputText>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- System Information Card -->
                        <div class="detail-card">
                            <div class="detail-card-header">
                                <h2 class="detail-card-title">System Information</h2>
                            </div>
                            <div class="detail-card-body">
                                <div class="detail-meta-list">
                                    <div class="detail-meta-row">
                                        <span class="detail-meta-label">Created At</span>
                                        <span class="detail-meta-value">
                                            <h:outputText value="#{deviceModelsMB.deviceModels.createdAt}">
                                                <f:convertDateTime pattern="MMM dd, yyyy · HH:mm" />
                                            </h:outputText>
                                        </span>
                                    </div>
                                    <div class="detail-meta-row">
                                        <span class="detail-meta-label">Updated At</span>
                                        <span class="detail-meta-value">
                                            <h:outputText value="#{deviceModelsMB.deviceModels.updatedAt}">
                                                <f:convertDateTime pattern="MMM dd, yyyy · HH:mm" />
                                            </h:outputText>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </h:form>
        </div>
    </div>
</h:body>
</html>
