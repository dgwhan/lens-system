<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

    <f:metadata>
        <f:viewParam name="search" value="#{deviceCatalogController.search}" />
        <f:viewParam name="type" value="#{deviceCatalogController.type}" />
        <f:viewParam name="brand" value="#{deviceCatalogController.brand}" />
        <f:viewParam name="rate" value="#{deviceCatalogController.rate}" />
        <f:viewParam name="page" value="#{deviceCatalogController.page}" />
        <f:viewAction action="#{deviceCatalogController.applyFilter()}" />
    </f:metadata>

    <h:head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Devices - Lens Camera Rental</title>

        <!-- Base Design System Stylesheets -->
        <h:outputStylesheet library="css" name="font.css" />
        <h:outputStylesheet library="css" name="app.css" />
        <h:outputStylesheet library="css" name="buttons.css" />
        <h:outputStylesheet library="css" name="customer.css" />
        <h:outputStylesheet library="css" name="header.css" />
        <h:outputStylesheet library="css" name="search.css" />
        <h:outputStylesheet library="css" name="nav.css" />
        <h:outputStylesheet library="css" name="breadcrumb.css" />
        <h:outputStylesheet library="css" name="page-title.css" />
        <h:outputStylesheet library="css" name="device-filter.css" />
        <h:outputStylesheet library="css" name="device-card.css" />
        <h:outputStylesheet library="css" name="device-table.css" />
        <h:outputStylesheet library="css" name="pagination.css" />
        <h:outputStylesheet library="css" name="contact-section.css" />
        <h:outputStylesheet library="css" name="customer-catalog.css" />
        <h:outputStylesheet library="css" name="footer.css" />

        <script type="text/javascript" src="#{request.contextPath}/resources/js/device-catalog.js?v=1.0"></script>
    </h:head>

    <h:body>
        <!-- 1. Shared Header Component -->
        <ui:include src="/components/header.xhtml" />

        <!-- Main Content Area -->
        <main class="customer-catalog-main" role="main">


            <!-- 3. Page Title: Devices -->
            <ui:include src="/components/page-title.xhtml">
                <ui:param name="title" value="Devices" />
                <ui:param name="subtitle" value="Explore our camera and lens equipment." />
                <ui:param name="asH1" value="true" />
            </ui:include>

            <!-- 4. Device Filter Bar -->
            <ui:include src="/components/device-filter.xhtml">
                <ui:param name="id" value="deviceCatalogFilter" />
                <ui:param name="types" value="#{deviceCatalogController.types}" />
                <ui:param name="brands" value="#{deviceCatalogController.brands}" />
                <ui:param name="search" value="#{deviceCatalogController.search}" />
                <ui:param name="selectedType" value="#{deviceCatalogController.type}" />
                <ui:param name="selectedBrand" value="#{deviceCatalogController.brand}" />
                <ui:param name="selectedPriceRange" value="#{deviceCatalogController.rate}" />
                <ui:param name="filteredCount" value="#{deviceCatalogController.filteredCount}" />
                <ui:param name="totalCount" value="#{deviceCatalogController.totalCount}" />
            </ui:include>

            <!-- 5. Device Catalog Card Grid -->
            <ui:include src="/components/device-grid.xhtml">
                <ui:param name="id" value="catalogGrid" />
                <ui:param name="devices" value="#{deviceCatalogController.pagedDevices}" />
                <ui:param name="controller" value="#{deviceCatalogController}" />
            </ui:include>

            <!-- 6. Pagination Landmark -->
            <ui:include src="/components/pagination.xhtml">
                <ui:param name="id" value="catalogPagination" />
                <ui:param name="currentPage" value="#{deviceCatalogController.page}" />
                <ui:param name="pageSize" value="#{deviceCatalogController.pageSize}" />
                <ui:param name="totalItems" value="#{deviceCatalogController.filteredCount}" />
                <ui:param name="itemLabel" value="devices" />
            </ui:include>

        </main>

        <!-- 8. Shared Footer Component -->
        <ui:include src="/components/footer.xhtml" />
    </h:body>

</html>
